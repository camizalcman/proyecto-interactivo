<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Proyecto interactivo</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="assets/css/styles.css">

        <!-- MEDIAPIPE CDN -->
        <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script> <!--detecta y trackea las manos-->
        <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script> <!--maneja el loop de frames de la cámara-->
    </head>

    <body>
        <div id="contenedor">

            <video id="video" playsinline muted></video>
            <canvas id="canvas"></canvas> <!--CANVAS DE DIBUJO-->
            <canvas id="overlay"></canvas> <!--CAPA DE INTERFAZ (paleta), se limpia cada frame-->

            <div id="cursor"></div> <!--CURSOR VISUAL-->

            <div id="estado">Cargando cámara...</div> <!--MENSAJE DE ESTADO-->

            <button id="limpiar">Limpiar</button> <!--BOTON LIMPIAR-->
            <button id="reglas">Reglas</button> <!--BOTON REGLAS-->
            <button id="gestos">Gestos</button> <!--BOTON GESTOS-->

        </div>

        <!-- El orden importa: config primero porque todos los demás lo usan,
             mediapipe último porque necesita que todo lo anterior ya esté cargado -->
        <script src="assets/js/config.js"></script>
        <script src="assets/js/canvas.js"></script>
        <script src="assets/js/paleta.js"></script>
        <script src="assets/js/gestos.js"></script>
        <script src="assets/js/manos.js"></script>
        <script src="assets/js/plantillas.js"></script>
        <script src="assets/js/cronometro.js"></script>
        <script src="assets/js/audio.js"></script>
        <script src="assets/js/reglas.js"></script>
        <script src="assets/js/mostrar-gestos.js"></script>
        <script src="assets/js/mediapipe.js"></script>

    </body>
</html>
